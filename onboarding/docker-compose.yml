name: augustwest-onboarding

# The onboarding wizard. Uses host networking so it can reach the local
# services (Immich, Vaultwarden, Nextcloud, Home Assistant) on 127.0.0.1,
# while binding its own UI to 127.0.0.1:8888 only — never the public network.
services:
  onboarding:
    build: .
    image: augustwest/onboarding:latest
    container_name: augustwest_onboarding
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      AW_DATA_DIR: /data
    volumes:
      - ./data:/data
